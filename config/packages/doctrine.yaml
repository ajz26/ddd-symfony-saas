doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            user_email: App\Users\Infrastructure\Persistence\Doctrine\Type\EmailType
            user_password: App\Users\Infrastructure\Persistence\Doctrine\Type\PasswordType
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Cards:
                type: xml
                dir: '%kernel.project_dir%/src/Cards/Infrastructure/Persistence/Doctrine/mapping'
                is_bundle: false
                prefix: 'App\Cards\Domain\Entity'
                alias: Cards
                mapping: true

            Clients:
                type: xml
                dir: '%kernel.project_dir%/src/Clients/Infrastructure/Persistence/Doctrine/mapping'
                is_bundle: false
                prefix: 'App\Clients\Domain\Entity'
                alias: Clients
                mapping: true

            Users:
                type: xml
                dir: '%kernel.project_dir%/src/Users/Infrastructure/Persistence/Doctrine/mapping'
                is_bundle: false
                prefix: 'App\Users\Domain\Entity'
                alias: Users
                mapping: true
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
